<!DOCTYPE html>
<html data-theme="{{theme}}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>{{title}}</title>
	<meta charset="utf-8">
	<link rel="stylesheet" id="theme-dark" href="{markserv}templates/github-markdown-dark.css"{{#unless themeDark}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-light" href="{markserv}templates/github-markdown-light.css"{{#unless themeLight}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-synthwave" href="{markserv}templates/github-markdown-synthwave.css"{{#unless themeSynthwave}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-solarized" href="{markserv}templates/github-markdown-solarized.css"{{#unless themeSolarized}} disabled{{/unless}}>
	<link rel="stylesheet" href="{markserv}templates/markserv.css">
	<link rel="stylesheet" href="{markserv}templates/highlight-js-github-gist.css">
	<link rel="stylesheet" href="{markserv}icons/icons.css">
</head>
<body class="dir">
<article class="markdown-body">
<h1 class="icon folder isfolder">{{#each breadcrumbs}}<a href="{{href}}">{{text}}</a>{{/each}}</h1>
{{#unless standalone}}
<div class="site-search" id="site-search">
	<input type="search" id="site-search-input" placeholder="Search this site…">
	<select id="site-search-scope" class="site-search-scope" title="Search scope">
		<option value="{{pagePath}}" selected>This folder</option>
		<option value="all">Whole site</option>
	</select>
	<ul id="site-search-results" class="site-search-results" hidden></ul>
</div>
{{/unless}}
{{{content}}}
<footer><sup><hr> Served by <a href="https://www.npmjs.com/package/markserv">MarkServ</a> | PID: {{pid}}</sup></footer>
</article>
{{#unless standalone}}
<div class="width-control" id="width-control">
    <span id="width-tooltip"></span>
    <input type="range" id="width-slider" min="0" max="1920" value="978" step="1">
</div>
<button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
<div class="page-actions" id="page-actions">
	<a class="page-action" href="/__markserv/export{{pagePath}}?format=zip" title="Download this directory as a zip of raw files">Download .zip</a>
	<a class="page-action" href="/__markserv/export{{pagePath}}?format=site" title="Download this directory as rendered HTML pages (zip)">Save as HTML</a>
</div>
<script>
(function() {
	var themes = ['dark', 'light', 'synthwave', 'solarized'];
	var icons = {dark: '\u{1F319}', light: '\u{2600}\u{FE0F}', synthwave: '\u{1F9D1}\u{200D}\u{1F3A4}', solarized: '\u{262F}\u{FE0F}'};
	var serverTheme = '{{theme}}' || 'dark';
	var current = localStorage.getItem('markserv-theme') || serverTheme;

	function applyTheme(t) {
		document.documentElement.setAttribute('data-theme', t);
		themes.forEach(function(name) {
			var el = document.getElementById('theme-' + name);
			if (el) el.disabled = (name !== t);
		});
		var btn = document.getElementById('theme-toggle');
		if (btn) btn.textContent = icons[t] || icons.dark;
		current = t;
	}

	applyTheme(current);

	document.getElementById('theme-toggle').addEventListener('click', function() {
		var idx = themes.indexOf(current);
		var next = themes[(idx + 1) % themes.length];
		localStorage.setItem('markserv-theme', next);
		applyTheme(next);
	});
})();
</script>
<script>
(function() {
    var slider = document.getElementById('width-slider');
    var tooltip = document.getElementById('width-tooltip');
    if (!slider) return;

    var CSS_DEFAULT = 978;   // must match body { width } in markserv.css
    var storageKey = 'markserv-width:' + '{{rootDir}}';
    var stored = localStorage.getItem(storageKey);

    function updateSliderMax() {
        // Slider max = current viewport width so user can slide up to full-bleed
        slider.max = window.innerWidth;
    }

    function applyWidth(px) {
        if (px === CSS_DEFAULT) {
            // Matches stylesheet default — remove inline style so CSS rules apply normally
            document.body.style.width = '';
        } else {
            document.body.style.width = px + 'px';
        }
        slider.value = Math.min(px, parseInt(slider.max, 10));
    }

    // Initialize
    updateSliderMax();
    if (stored) {
        applyWidth(parseInt(stored, 10));
    } else {
        // No stored value — keep the 978px stylesheet default; slider reflects it
        slider.value = Math.min(CSS_DEFAULT, parseInt(slider.max, 10));
    }

    function positionTooltip() {
        if (!tooltip) return;
        var val = parseInt(slider.value, 10);
        var min = parseInt(slider.min, 10);
        var max = parseInt(slider.max, 10);
        var pct = (val - min) / (max - min);
        var sliderW = slider.offsetWidth;
        var thumbW = 14;
        var offset = thumbW / 2 + pct * (sliderW - thumbW);
        tooltip.textContent = val + 'px';
        tooltip.style.left = offset + 'px';
        tooltip.style.transform = 'translateX(-50%)';
    }

    // Slider input → live update
    slider.addEventListener('input', function() {
        var val = parseInt(slider.value, 10);
        applyWidth(val);
        localStorage.setItem(storageKey, String(val));
        if (tooltip) tooltip.classList.add('visible');
        positionTooltip();
    });

    slider.addEventListener('mousedown', function() {
        if (tooltip) tooltip.classList.add('visible');
        positionTooltip();
    });

    window.addEventListener('mouseup', function() {
        if (tooltip) tooltip.classList.remove('visible');
    });

    slider.addEventListener('focus', function() {
        if (tooltip) tooltip.classList.add('visible');
        positionTooltip();
    });

    slider.addEventListener('blur', function() {
        if (tooltip) tooltip.classList.remove('visible');
    });

    // Double-click to reset to default width
    slider.addEventListener('dblclick', function() {
        applyWidth(CSS_DEFAULT);
        localStorage.removeItem(storageKey);
    });

    // On window resize, update slider max to reflect new viewport
    window.addEventListener('resize', function() {
        updateSliderMax();
    });
})();
</script>
<script>
(function() {
	// Site search: debounced fetch of /__markserv/search, results
	// rendered as DOM nodes (never innerHTML with search data) so
	// file names and snippets can't inject markup. '/' focuses the
	// input, Escape clears it.
	var input = document.getElementById('site-search-input');
	var list = document.getElementById('site-search-results');
	if (!input || !list) return;

	var timer = null;

	function clear() {
		list.innerHTML = '';
		list.hidden = true;
	}

	function render(results) {
		list.innerHTML = '';
		var q = input.value.trim().toLowerCase();
		results.forEach(function(r) {
			var li = document.createElement('li');
			var a = document.createElement('a');
			a.href = '/' + r.path + (r.anchor ? '#' + r.anchor : '');
			var title = document.createElement('strong');
			title.textContent = r.title;
			var pathEl = document.createElement('span');
			pathEl.className = 'site-search-path';
			pathEl.textContent = ' ' + r.path;
			a.appendChild(title);
			a.appendChild(pathEl);
			var p = document.createElement('p');
			if (r.snippet) {
				var idx = q ? r.snippet.toLowerCase().indexOf(q) : -1;
				if (idx >= 0) {
					p.appendChild(document.createTextNode(r.snippet.slice(0, idx)));
					var m = document.createElement('mark');
					m.textContent = r.snippet.slice(idx, idx + q.length);
					p.appendChild(m);
					p.appendChild(document.createTextNode(r.snippet.slice(idx + q.length)));
				} else {
					p.textContent = r.snippet;
				}
			}
			li.appendChild(a);
			li.appendChild(p);
			list.appendChild(li);
		});
		list.hidden = results.length === 0;
	}

	function doSearch() {
		var q = input.value.trim();
		if (!q) {
			clear();
			return;
		}
		var scope = document.getElementById('site-search-scope');
		fetch('/__markserv/search?q=' + encodeURIComponent(q) +
			'&path=' + encodeURIComponent(scope ? scope.value : 'all'))
			.then(function(res) {
				if (!res.ok) return [];
				return res.json();
			})
			.then(render)
			.catch(clear);
	}

	input.addEventListener('input', function() {
		clearTimeout(timer);
		timer = setTimeout(doSearch, 200);
	});

	input.addEventListener('keydown', function(e) {
		if (e.key === 'Escape') {
			input.value = '';
			clear();
			input.blur();
		}
	});

	// Scope change re-runs the current search (if any)
	var scopeEl = document.getElementById('site-search-scope');
	if (scopeEl) {
		scopeEl.addEventListener('change', function() {
			if (input.value.trim()) {
				doSearch();
			}
		});
	}

	document.addEventListener('keydown', function(e) {
		if (e.key === '/' && document.activeElement !== input) {
			e.preventDefault();
			input.focus();
		}
	});
})();
</script>
{{/unless}}
{{#if hotreload}}{{#unless standalone}}
<script>
(function() {
	var ws;
	var delay = 1000;
	var maxDelay = 30000;
	var maxRetries = 20;
	var retries = 0;

	function connect() {
		ws = new WebSocket('ws://localhost:{{wsPort}}');
		ws.onopen = function() {
			delay = 1000;
			retries = 0;
			ws.send(JSON.stringify({path: location.pathname}));
		};
		ws.onmessage = function(e) {
			var el = document.querySelector('.markdown-body');
			if (el) el.innerHTML = e.data;
		};
		ws.onclose = function() {
			if (retries < maxRetries) {
				retries++;
				setTimeout(connect, delay);
				delay = Math.min(delay * 2, maxDelay);
			}
		};
	}
	connect();
})();
</script>
{{/unless}}{{/if}}
</body>
</html>
