<!DOCTYPE html>
<html data-theme="{{theme}}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>{{title}}</title>
	<meta charset="utf-8">
	<link rel="stylesheet" id="theme-dark" href="{markserv}templates/github-markdown-dark.css"{{#unless themeDark}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-light" href="{markserv}templates/github-markdown-light.css"{{#unless themeLight}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-synthwave" href="{markserv}templates/github-markdown-synthwave.css"{{#unless themeSynthwave}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-solarized" href="{markserv}templates/github-markdown-solarized.css"{{#unless themeSolarized}} disabled{{/unless}}>
	<link rel="stylesheet" href="{markserv}templates/markserv.css">
	<link rel="stylesheet" href="{markserv}templates/highlight-js-github-gist.css">
	<script type="text/javascript" id="MathJax-script" async
	      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
        </script>
</head>
<body>
<article class="markdown-body">
{{#unless standalone}}
<div class="site-search" id="site-search">
	<input type="search" id="site-search-input" placeholder="Search this site…">
	<select id="site-search-scope" class="site-search-scope" title="Search scope">
		<option value="{{pagePath}}" selected>This page</option>
		<option value="all">Whole site</option>
	</select>
	<ul id="site-search-results" class="site-search-results" hidden></ul>
</div>
{{/unless}}
{{{content}}}
<footer><sup><hr> Served by <a href="https://www.npmjs.com/package/markserv">MarkServ</a> | PID: {{pid}}</sup></footer>
</article>
{{#unless standalone}}
<div class="width-control" id="width-control">
    <span id="width-tooltip"></span>
    <input type="range" id="width-slider" min="0" max="1920" value="978" step="1">
</div>
<button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
<div class="page-actions" id="page-actions">
	<a class="page-action" href="/__markserv/export{{pagePath}}?format=html" title="Download this page as standalone HTML">Save as HTML</a>
	<a class="page-action" href="/__markserv/export{{pagePath}}?format=md" title="Download the markdown source">Download .md</a>
</div>
<script>
(function() {
	var themes = ['dark', 'light', 'synthwave', 'solarized'];
	var icons = {dark: '\u{1F319}', light: '\u{2600}\u{FE0F}', synthwave: '\u{1F9D1}\u{200D}\u{1F3A4}', solarized: '\u{262F}\u{FE0F}'};
	var serverTheme = '{{theme}}' || 'dark';
	var current = localStorage.getItem('markserv-theme') || serverTheme;

	function applyTheme(t) {
		document.documentElement.setAttribute('data-theme', t);
		themes.forEach(function(name) {
			var el = document.getElementById('theme-' + name);
			if (el) el.disabled = (name !== t);
		});
		var btn = document.getElementById('theme-toggle');
		if (btn) btn.textContent = icons[t] || icons.dark;
		current = t;

		// Re-render mermaid diagrams so they follow the new theme
		// (mermaid bakes theme CSS into the SVG at render time)
		if (window.markservRenderMermaid) {
			window.markservRenderMermaid();
		}
	}

	applyTheme(current);

	document.getElementById('theme-toggle').addEventListener('click', function() {
		var idx = themes.indexOf(current);
		var next = themes[(idx + 1) % themes.length];
		localStorage.setItem('markserv-theme', next);
		applyTheme(next);
	});
})();
</script>
<script>
(function() {
    var slider = document.getElementById('width-slider');
    var tooltip = document.getElementById('width-tooltip');
    if (!slider) return;

    var CSS_DEFAULT = 978;   // must match body { width } in markserv.css
    var storageKey = 'markserv-width:' + '{{rootDir}}';
    var stored = localStorage.getItem(storageKey);

    function updateSliderMax() {
        // Slider max = current viewport width so user can slide up to full-bleed
        slider.max = window.innerWidth;
    }

    function applyWidth(px) {
        if (px === CSS_DEFAULT) {
            // Matches stylesheet default — remove inline style so CSS rules apply normally
            document.body.style.width = '';
        } else {
            document.body.style.width = px + 'px';
        }
        slider.value = Math.min(px, parseInt(slider.max, 10));
    }

    // Initialize
    updateSliderMax();
    if (stored) {
        applyWidth(parseInt(stored, 10));
    } else {
        // No stored value — keep the 978px stylesheet default; slider reflects it
        slider.value = Math.min(CSS_DEFAULT, parseInt(slider.max, 10));
    }

    function positionTooltip() {
        if (!tooltip) return;
        var val = parseInt(slider.value, 10);
        var min = parseInt(slider.min, 10);
        var max = parseInt(slider.max, 10);
        var pct = (val - min) / (max - min);
        var sliderW = slider.offsetWidth;
        var thumbW = 14;
        var offset = thumbW / 2 + pct * (sliderW - thumbW);
        tooltip.textContent = val + 'px';
        tooltip.style.left = offset + 'px';
        tooltip.style.transform = 'translateX(-50%)';
    }

    // Slider input → live update
    slider.addEventListener('input', function() {
        var val = parseInt(slider.value, 10);
        applyWidth(val);
        localStorage.setItem(storageKey, String(val));
        if (tooltip) tooltip.classList.add('visible');
        positionTooltip();
    });

    slider.addEventListener('mousedown', function() {
        if (tooltip) tooltip.classList.add('visible');
        positionTooltip();
    });

    window.addEventListener('mouseup', function() {
        if (tooltip) tooltip.classList.remove('visible');
    });

    slider.addEventListener('focus', function() {
        if (tooltip) tooltip.classList.add('visible');
        positionTooltip();
    });

    slider.addEventListener('blur', function() {
        if (tooltip) tooltip.classList.remove('visible');
    });

    // Double-click to reset to default width
    slider.addEventListener('dblclick', function() {
        applyWidth(CSS_DEFAULT);
        localStorage.removeItem(storageKey);
    });

    // On window resize, update slider max to reflect new viewport
    window.addEventListener('resize', function() {
        updateSliderMax();
    });
})();
</script>
<script>
(function() {
	// Site search: debounced fetch of /__markserv/search, results
	// rendered as DOM nodes (never innerHTML with search data) so
	// file names and snippets can't inject markup. '/' focuses the
	// input, Escape clears it.
	var input = document.getElementById('site-search-input');
	var list = document.getElementById('site-search-results');
	if (!input || !list) return;

	var timer = null;

	function clear() {
		list.innerHTML = '';
		list.hidden = true;
	}

	function statusRow(id, text) {
		var li = document.createElement('li');
		if (id) {
			li.id = id;
		}

		li.className = 'site-search-status';
		li.textContent = text;
		return li;
	}

	function render(body) {
		list.innerHTML = '';
		list.hidden = false;
		var q = input.value.trim().toLowerCase();
		var data = (body && body.results) ? body : {results: body || []};
		var results = data.results;
		var matches = data.matches || 0;
		var files = data.files || 0;

		if (results.length === 0) {
			// A search ran with zero hits — the list stays visible
			list.appendChild(statusRow(null, 'No matches'));
			return;
		}

		list.appendChild(statusRow('site-search-status',
			matches + (matches === 1 ? ' match' : ' matches') +
			' across ' + files + (files === 1 ? ' file' : ' files')));

		results.forEach(function(r) {
			var li = document.createElement('li');
			var a = document.createElement('a');
			a.href = (r.matchNo === null)
				? '/' + r.path + '#' + r.anchor
				: '/' + r.path + '?markservSearch=' + encodeURIComponent(q) +
					(r.matchNo > 1 ? '&markservGoto=' + r.matchNo : '');
			var title = document.createElement('strong');
			title.textContent = r.title;
			var pathEl = document.createElement('span');
			pathEl.className = 'site-search-path';
			pathEl.textContent = ' ' + r.path;
			a.appendChild(title);
			a.appendChild(pathEl);
			var p = document.createElement('p');
			if (r.snippet) {
				var idx = q ? r.snippet.toLowerCase().indexOf(q) : -1;
				if (idx >= 0) {
					p.appendChild(document.createTextNode(r.snippet.slice(0, idx)));
					var m = document.createElement('mark');
					m.textContent = r.snippet.slice(idx, idx + q.length);
					p.appendChild(m);
					p.appendChild(document.createTextNode(r.snippet.slice(idx + q.length)));
				} else {
					p.textContent = r.snippet;
				}
			}
			li.appendChild(a);
			li.appendChild(p);
			list.appendChild(li);
		});
	}

	function doSearch() {
		var q = input.value.trim();
		if (!q) {
			clear();
			return;
		}
		var scope = document.getElementById('site-search-scope');
		fetch('/__markserv/search?q=' + encodeURIComponent(q) +
			'&path=' + encodeURIComponent(scope ? scope.value : 'all'))
			.then(function(res) {
				if (!res.ok) return [];
				return res.json();
			})
			.then(render)
			.catch(clear);
	}

	input.addEventListener('input', function() {
		clearTimeout(timer);
		timer = setTimeout(doSearch, 200);
	});

	input.addEventListener('keydown', function(e) {
		if (e.key === 'Escape') {
			input.value = '';
			clear();
			input.blur();
		}
	});

	// Scope change re-runs the current search (if any)
	var scopeEl = document.getElementById('site-search-scope');
	if (scopeEl) {
		scopeEl.addEventListener('change', function() {
			if (input.value.trim()) {
				doSearch();
			}
		});
	}

	document.addEventListener('keydown', function(e) {
		if (e.key === '/' && document.activeElement !== input) {
			e.preventDefault();
			input.focus();
		}
	});
})();
</script>
<script>
(function() {
	// Search jump-to: one-shot ?markservSearch=<term>[&markservGoto=<n>]
	// (set by a search result row's link). Wrap every occurrence of
	// the term in the page body in <mark class="markserv-search-match">,
	// scroll the n-th mark into view, then clean the URL so a refresh
	// does not re-highlight (one-shot by design; hot reload replaces
	// the body and drops any active highlights).
	var params = new URLSearchParams(location.search);
	var term = params.get('markservSearch');
	if (!term) return;
	var goto = parseInt(params.get('markservGoto'), 10);
	if (!goto || goto < 1) goto = 1;

	var body = document.querySelector('.markdown-body');
	if (body) {
		var lower = term.toLowerCase();
		// Collect the text nodes up front: wrapping mutates the tree,
		// and a walker must not visit (and re-wrap) the nodes it
		// creates.
		var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
		var nodes = [];
		var n;
		while ((n = walker.nextNode()) !== null) {
			nodes.push(n)
		}

		nodes.forEach(function(node) {
			// Fast path: nodes without the term are left untouched
			if (node.nodeValue.toLowerCase().indexOf(lower) === -1) {
				return
			}

			// Split-and-wrap each occurrence (repeat until none left)
			var current = node
			while (true) {
				var idx = current.nodeValue.toLowerCase().indexOf(lower);
				if (idx === -1) {
					break
				}

				var matchNode = current.splitText(idx)
				var rest = matchNode.splitText(term.length)
				var mark = document.createElement('mark')
				mark.className = 'markserv-search-match'
				matchNode.parentNode.insertBefore(mark, matchNode)
				mark.appendChild(matchNode)
				current = rest
			}
		})
	}

	var marks = document.querySelectorAll('.markdown-body mark.markserv-search-match');
	if (marks.length) {
		marks[Math.min(goto, marks.length) - 1].scrollIntoView({block: 'center'});
	}

	history.replaceState(null, '', location.pathname + location.hash);
})();
</script>
{{/unless}}
{{#if hotreload}}{{#unless standalone}}
<script>
(function() {
	var ws;
	var delay = 1000;
	var maxDelay = 30000;
	var maxRetries = 20;
	var retries = 0;

	function connect() {
		ws = new WebSocket('ws://localhost:{{wsPort}}');
		ws.onopen = function() {
			delay = 1000;
			retries = 0;
			ws.send(JSON.stringify({path: location.pathname}));
		};
		ws.onmessage = function(e) {
			var el = document.querySelector('.markdown-body');
			if (el) {
				el.innerHTML = e.data;
				if (el.querySelector('pre.mermaid')) {
					window.markservLoadMermaid();
				}
			}
		};
		ws.onclose = function() {
			if (retries < maxRetries) {
				retries++;
				setTimeout(connect, delay);
				delay = Math.min(delay * 2, maxDelay);
			}
		};
	}
	connect();
})();
</script>
{{/unless}}{{/if}}
<script>
(function() {
	// Lazy mermaid loader: costs nothing on pages without a mermaid fence.
	// The library is served locally by markserv (the mermaid npm
	// package's ESM dist, under /vendor/mermaid/), so pages work
	// offline; if the module fails to load the fence degrades to its
	// source text. The module is appended asynchronously and rendered
	// via contentLoaded(), because startOnLoad hooks the window load
	// event, which may already have fired by the time the module
	// answers.
	var loading = false;
	var sourceCache = new WeakMap();

	function mermaidThemeFor(theme) {
		return theme === 'light' ? 'default' : (theme === 'solarized' ? 'neutral' : 'dark')
	}

	// Render/re-render all mermaid fences with the page's current theme.
	// Mermaid replaces a fence's content with the SVG, so previously
	// rendered fences get their source restored from the cache first.
	window.markservRenderMermaid = function() {
		// window.mermaid can be a named element (e.g. <h1 id="mermaid">);
		// only treat it as the library if it actually exposes the API
		var mermaidLib = window.mermaid;
		if (!mermaidLib || typeof mermaidLib.contentLoaded !== 'function') {
			return
		}

		var els = document.querySelectorAll('pre.mermaid');
		els.forEach(function(el) {
			if (!sourceCache.has(el)) {
				sourceCache.set(el, el.innerHTML);
			}
		});
		els.forEach(function(el) {
			if (el.getAttribute('data-processed')) {
				el.innerHTML = sourceCache.get(el);
				el.removeAttribute('data-processed');
			}
		});

		var theme = document.documentElement.getAttribute('data-theme') || 'dark';
		mermaidLib.initialize({
			theme: mermaidThemeFor(theme),
			// Strict by default: mermaid sanitizes diagram link targets
			// (dangerous url schemes like javascript: are inert). Plain url
			// links are clickable either way and update the page location;
			// --mermaid-loose lifts the sanitization (securityLevel 'loose'),
			// for trusted, locally served markdown.
			securityLevel: '{{#if mermaidLoose}}loose{{else}}strict{{/if}}'
		});
		mermaidLib.contentLoaded();
	};

	window.markservLoadMermaid = function() {
		var mermaidLib = window.mermaid;
		if (mermaidLib && typeof mermaidLib.contentLoaded === 'function') {
			window.markservRenderMermaid();
			return
		}

		if (loading) {
			return
		}

		loading = true;
		// mermaid v11 is a code-split ESM build with no UMD global:
		// import the locally served shim as a module and expose the API
		// on window for markservRenderMermaid()
		var script = document.createElement('script');
		script.type = 'module';
		script.textContent =
			"import * as m from '/vendor/mermaid/mermaid.esm.min.mjs';" +
			'window.mermaid = m.default || m;' +
			'window.markservRenderMermaid();';
		script.onerror = function() {
			// Script failed to load: keep the diagram source as plain text
			loading = false;
		};
		document.head.appendChild(script);
	};

	if (document.querySelector('pre.mermaid')) {
		window.markservLoadMermaid();
	}
})();
</script>
</body>
</html>
